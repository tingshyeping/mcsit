<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微处理器与个人计算机发展史 (2)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        :root {
            --bg: #f6f1e7;
            --bg-deep: #efe4d6;
            --ink: #171717;
            --muted: #5b5b5b;
            --accent: #d3542c;
            --accent-light: #ff8f5a;
            --accent-dark: #b14320;
            --teal: #1f6f78;
            --card: #fff7ef;
            --stroke: #e3d6c5;
            --shadow: 0 18px 40px rgba(23, 23, 23, 0.12);
            --radius-sm: 10px;
            --radius-md: 12px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --radius-2xl: 22px;
            --space-1: 6px;
            --space-2: 8px;
            --space-3: 10px;
            --space-4: 12px;
            --space-5: 14px;
            --space-6: 16px;
            --space-7: 18px;
            --space-8: 20px;
            --space-9: 24px;
            --space-10: 32px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'IBM Plex Sans', sans-serif;
            --error: #b54832;
        }

        body {
            font-family: var(--font-body);
            background:
                radial-gradient(240px 140px at 10% -10%, #ffd2b9 0%, transparent 70%),
                radial-gradient(220px 160px at 90% 0%, #cfe7e6 0%, transparent 65%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--ink);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            padding: var(--space-10) var(--space-8);
            box-sizing: border-box;
            background: var(--card);
            border-radius: var(--radius-2xl);
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow);
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .progress-text {
            color: var(--muted);
            font-size: 0.9em;
        }

        .status-bar {
            display: flex;
            gap: 16px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-correct { color: var(--teal); }
        .status-wrong { color: var(--error); }

        .question-text {
            font-family: var(--font-display);
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .options-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            background-color: #fff;
            border: 1px solid var(--stroke);
            padding: var(--space-4) var(--space-6);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item:hover:not(.selected) {
            background-color: var(--card);
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .option-item.selected.correct {
            background-color: rgba(31, 111, 120, 0.12);
            border-color: var(--teal);
        }

        .option-item.selected.incorrect {
            background-color: rgba(181, 72, 50, 0.12);
            border-color: var(--error);
        }

        .option-item.revealed-correct {
            border-color: rgba(31, 111, 120, 0.5);
            box-shadow: inset 0 0 0 1px rgba(31, 111, 120, 0.16);
        }

        .option-label {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feedback-state {
            font-weight: bold;
            font-size: 0.9em;
            display: none;
        }

        .selected .feedback-state {
            display: block;
        }

        .revealed-correct .feedback-state {
            display: block;
        }

        .correct .feedback-state { color: var(--teal); }
        .incorrect .feedback-state { color: var(--error); }
        .revealed-correct .feedback-state { color: var(--teal); }

        .rationale {
            font-size: 0.95em;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.5;
            display: none;
        }

        .selected .rationale {
            display: block;
        }

        .revealed-correct .rationale {
            display: block;
        }
        .hint-toggle {
            border: 1px solid var(--stroke);
            color: var(--muted);
            cursor: pointer;
            padding: var(--space-2) var(--space-6);
            border-radius: var(--radius-md);
            background-color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hint-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .hint-content {
            margin-top: 32px;
            padding: var(--space-6);
            background-color: #fff;
            border: 1px solid var(--stroke);
            border-radius: var(--radius-lg);
            font-size: 0.95em;
            color: var(--muted);
            display: none;
            align-items: flex-start;
            gap: 16px;
        }

        .hint-content.active {
            display: flex;
        }

        .hint-icon-box {
            color: var(--accent-dark);
            font-size: 1.2em;
            margin-top: -2px;
        }

        .navigation {
            margin-top: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-7);
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-prev {
            background-color: #fff;
            color: var(--ink);
            border-color: var(--stroke);
        }

        .btn-prev:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .btn-next {
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            color: #fff;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .results-screen {
            display: flex;
            flex-direction: column;
            gap: var(--space-8);
        }

        .results-title {
            font-family: var(--font-display);
            font-size: 2.1em;
            margin: 0;
        }

        .results-subtitle {
            color: var(--muted);
            margin: 0;
            font-size: 1em;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-6);
        }

        .result-card {
            padding: var(--space-6);
            border-radius: var(--radius-xl);
            background: #fff;
            border: 1px solid var(--stroke);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .result-label {
            color: var(--muted);
            font-size: 0.95em;
        }

        .result-value {
            font-size: 2em;
            font-family: var(--font-display);
        }

        .result-metrics {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            color: var(--muted);
            font-size: 0.95em;
        }

        .results-actions {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
        }

        .btn-ghost {
            background-color: transparent;
            border: 1px solid var(--stroke);
            color: var(--ink);
        }

        .hidden { display: none; }

        @media (max-width: 900px) {
            .quiz-container {
                margin: var(--space-8);
                max-width: 100%;
            }
        }

        @media (max-width: 720px) {
            .quiz-container {
                padding: var(--space-8) var(--space-6);
            }

            .question-text {
                font-size: 1.3em;
            }

            .option-item {
                padding: var(--space-4);
            }
        }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
            }

            .quiz-container {
                margin: var(--space-6);
                padding: var(--space-7) var(--space-5);
            }

            .progress-container {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-3);
            }

            .navigation {
                flex-direction: column;
                align-items: stretch;
                gap: var(--space-4);
            }

            .nav-buttons {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .hint-toggle {
                justify-content: space-between;
            }

            .results-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="quiz-content">
            <!-- Dynamic Content -->
        </div>
        <div id="results-content" class="hidden"></div>

        <div id="hint-box" class="hint-content">
            <div class="hint-icon-box">💡</div>
            <div id="hint-text"></div>
        </div>

        <div class="navigation">
            <button id="hint-toggle" class="hint-toggle">
                <span>Hint</span>
                <span id="hint-icon-arrow">▼</span>
            </button>
            <div class="nav-buttons">
                <button id="prev-btn" class="btn btn-prev">Previous</button>
                <button id="next-btn" class="btn btn-next">Next</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [{"answerOptions":[{"isCorrect":true,"rationale":"该乘积结合了步数和每步等效逻辑操作数，被定义为计算工作量 $W$。","text":"它代表了 FSM 计算函数 $f$ 时所做的“计算工作量” ($W$)。"},{"isCorrect":false,"rationale":"磁带移动是图灵机的特征，而该不等式是基于 FSM 电路模拟推导出的。","text":"它是衡量 FSM 磁带单元在模拟过程中移动的距离总和。"},{"isCorrect":false,"rationale":"这是对 RAM 专用不等式 $C(f) \\le \\alpha ST$ 的混淆，且两者并非简单的反比关系。","text":"它定义了 RAM 模型中内存位 $S$ 与时间 $T$ 的反比关系。"},{"isCorrect":false,"rationale":"该选项忽略了 $C(L)$ 这一代表每步等效逻辑操作量的关键维度。","text":"它仅表示 FSM 在计算过程中消耗的总时间资源。"}],"hint":"请考虑该乘积在物理意义上如何将时间步数与电路逻辑规模结合起来。","question":"根据 Savage 教授的教材，关于有限状态机 (FSM) 计算函数 $f$ 的计算不等式 $C(f) \\le T \\cdot C(L)$，下列哪项关于 $T \\cdot C(L)$ 的描述是准确的？"},{"answerOptions":[{"isCorrect":false,"rationale":"并集操作通常会扩大集合规模，且空集虽然是任何集合的子集，但这里的描述逻辑错误。","text":"$A$ 是通过对 $B$ 进行并集操作 $\\cup$ 后得到的空集。"},{"isCorrect":false,"rationale":"这是对“不相交集合”的定义，与真子集的概念完全相反。","text":"$A$ 和 $B$ 必须是互斥的，即其交集为空集 $\\emptyset$。"},{"isCorrect":false,"rationale":"如果基数相等且 $A \\subseteq B$，则 $A = B$，这违反了真子集的定义。","text":"集合 $A$ 的基数 $|A|$ 必须等于集合 $B$ 的基数 $|B|$。"},{"isCorrect":true,"rationale":"真子集要求满足子集条件的同时，父集必须包含子集不具备的额外元素。","text":"$A$ 中的每个元素都在 $B$ 中，且 $B$ 中至少有一个元素不在 $A$ 中。"}],"hint":"真子集与普通子集的区别在于两个集合是否可能完全相等。","question":"在集合论的初步概念中，若集合 $A$ 是集合 $B$ 的“真子集” (Proper Subset)，通常记作 $A \\subset B$。这种关系的必要条件是什么？"},{"answerOptions":[{"isCorrect":false,"rationale":"PRAM 模型属于20世纪80年代并行计算研究的产物。","text":"定义了 PRAM 模型中处理器同步读写内存的规则。"},{"isCorrect":false,"rationale":"图灵机是由艾伦·图灵在1936年提出的，而非香农。","text":"提出了通用的计算模型——图灵机。"},{"isCorrect":false,"rationale":"这是查尔斯·巴贝奇在设计解析机时借鉴的想法。","text":"开发了用于模拟 Jacquard 织布机的打孔卡片序列。"},{"isCorrect":true,"rationale":"香农通过布尔代数将逻辑运算与物理电路设计联系起来，奠定了数字电路的基础。","text":"证明布尔代数可以用于解释继电电路的运行原理。"}],"hint":"这项贡献涉及数学逻辑与机电继电器之间的桥梁。","question":"在理论计算机科学的历史中，Claude Shannon 在1938年做出的哪项贡献被认为对机电计算机的理解至关重要？"},{"answerOptions":[{"isCorrect":false,"rationale":"ABC 的创新之一正是采用了二进制系统进行物理方程求解。","text":"它使用的是十进制而非二进制逻辑进行计算。"},{"isCorrect":false,"rationale":"ABC 已经使用了电子管和电容器，区别于巴贝奇的机械设计。","text":"它完全采用机械齿轮进行算术运算，而非电子元件。"},{"isCorrect":true,"rationale":"ABC 仅能处理数据，其运行逻辑并非通过存储在内部的程序来控制。","text":"它不是存储程序计算机，无法在内存中存储指令。"},{"isCorrect":false,"rationale":"虽然它使用旋转鼓内存，但其再生机制实际上与现代动态 RAM 有相似之处。","text":"它的内存采用了与现代 RAM 完全不同的磁带读取方式。"}],"hint":"请关注“程序”与其“硬件运行逻辑”之间的关系。","question":"Atanasoff-Berry Computer (ABC) 被称为第一台电子计算机原型，但它与现代计算机相比有一个显著的限制。该限制是什么？"},{"answerOptions":[{"isCorrect":false,"rationale":"PRAM 研究的是多处理器架构，而非单处理器上的多用户分时系统。","text":"它通过模拟分时操作系统来允许多个用户同时访问单一处理器。"},{"isCorrect":false,"rationale":"这是对标准图灵机（TM）单头移动特性的描述。","text":"它是一个拥有无限线性单元阵列的控制单元，仅能移动到相邻单元。"},{"isCorrect":false,"rationale":"PRAM 是抽象并行模型，而 I/O 复杂性研究的是内存层级间的数据移动。","text":"它依赖于 VLSI 技术，专门用于减少 CPU 与外设之间的 I/O 复杂性。"},{"isCorrect":true,"rationale":"PRAM 强调处理器的同步协作以及对共享内存空间的并发访问。","text":"一组同步处理器交替地从公共内存阵列读取数据、进行局部计算并写入数据。"}],"hint":"这种模型关注的是多个处理器如何共享和操作同一个数据仓库。","question":"关于并行随机访问机 (PRAM) 的描述，下列哪项最能体现其在20世纪80年代模型设计中的特征？"},{"answerOptions":[{"isCorrect":false,"rationale":"闭包中的每个字符串元素必须是有限长度的，尽管集合本身是无限的。","text":"所有由 0 构成的无限长字符串序列。"},{"isCorrect":false,"rationale":"这是正闭包 $A^+$ 的定义，克莱尼闭包必须显式包含空字符串。","text":"仅包含长度大于 0 的字符串集合。"},{"isCorrect":false,"rationale":"这仅仅是字母表 $A$ 本身，而不是通过连接运算生成的闭包集合。","text":"仅包含 0 和 1 这两个基本字符的集合。"},{"isCorrect":true,"rationale":"克莱尼闭包包含了由字母表中元素构成的所有可能长度（从零到无穷大）的字符串集合。","text":"包括空字符串 $\\epsilon$ 在内的所有长度的 0 和 1 的组合。"}],"hint":"闭包操作不仅涉及字符的组合，还包含了一个代表“无”的特殊起始元素。","question":"在形式语言理论中，如果一个字母表 $A = \\{0, 1\\}$，那么其克莱尼闭包 (Kleene Closure) $A^*$ 包含以下哪些元素？"},{"answerOptions":[{"isCorrect":false,"rationale":"不等式仅给出了资源消耗的下界约束，并不保证两者之间存在线性的置换关系。","text":"增加内存 $S$ 总是能成比例地减少计算所需的步数 $T$。"},{"isCorrect":true,"rationale":"该不等式表明，逻辑复杂度高的函数需要更多的内存空间或更多的计算步数，或者两者兼而有之。","text":"空间 (Space) 和时间 (Time) 的乘积是衡量问题复杂性的重要度量。"},{"isCorrect":false,"rationale":"该不等式主要关注内存和时间的权衡，并未直接涉及 I/O 复杂性中关于层级间移动的细节。","text":"在计算过程中，I/O 操作的复杂性会超过处理器内部的逻辑复杂度。"},{"isCorrect":false,"rationale":"$C(f)$ 是函数的固有复杂度，但该不等式正是为了将固有复杂度与特定架构资源（$S, T$）联系起来。","text":"电路复杂度 $C(f)$ 是一个恒定常数，与计算机架构无关。"}],"hint":"请思考当函数的电路规模非常大时，对硬件资源（内存和运行时间）会有什么强制性要求。","question":"对于具有 $S$ 位存储容量的受限内存 RAM 而言，计算不等式 $C(f) \\le \\alpha ST$ 揭示了什么核心观点？"},{"answerOptions":[{"isCorrect":false,"rationale":"VisiCalc 被称为“带动硬件销售的软件尾巴”，但它是在 Apple II 上成名的，而非 Xerox 的发明。","text":"第一款商用成功的电子表格软件 VisiCalc。"},{"isCorrect":false,"rationale":"Altair 是由 MITS 公司生产的，并不是 Xerox PARC 的研究成果。","text":"基于 Intel 8080 芯片的 Altair 8800 计算机包。"},{"isCorrect":false,"rationale":"差分机是查尔斯·巴贝奇在19世纪的贡献，与 Xerox PARC 的现代计算研究无关。","text":"用于轨迹计算的差分机机械结构。"},{"isCorrect":true,"rationale":"乔布斯在参观 Xerox PARC 后受到启发，将这些技术引入了 Apple 的产品线。","text":"基于位图显示的图形用户界面 (GUI) 和鼠标。"}],"hint":"这项技术让电脑的操作从单纯的文本输入转变为可视化的点击操作。","question":"在微型计算机的发展史上，Xerox PARC (帕罗奥图研究中心) 的哪项发明直接影响了 Apple Lisa 和 Macintosh 的用户界面设计？"},{"answerOptions":[{"isCorrect":false,"rationale":"Microsoft 的兴起与 1981 年发布的 IBM PC 及其克隆机密切相关。","text":"它是第一台由 Microsoft 提供操作系统支持的个人电脑。"},{"isCorrect":true,"rationale":"它是第一台实现的存储程序计算机 (SPC)，尽管其指令集最初非常有限。","text":"它是第一台完全基于存储在内存中的指令运行的电子机器。"},{"isCorrect":false,"rationale":"微处理器的诞生（如 Intel 4004）要等到20世纪70年代初。","text":"它是第一台将 CPU 所有逻辑电路集成到单一芯片上的微处理器。"},{"isCorrect":false,"rationale":"这描述的是 ENIAC 的开发背景，ENIAC 最初并非存储程序架构。","text":"它是第一台为了解决第二次世界大战弹道计算而设计的机器。"}],"hint":"请考虑它在“如何处理指令”方面的开创性意义。","question":"1948年诞生的“曼彻斯特机” (The Manchester Machine) 在计算机架构演进中的地位是什么？"},{"answerOptions":[{"isCorrect":false,"rationale":"这是 Atanasoff 在二战期间离开 ABC 项目后加入的机构，与 4004 无关。","text":"美国海军军械实验室的弹道分析仪。"},{"isCorrect":false,"rationale":"IBM PC 使用的是后来的 8088/8086 系列芯片，4004 的性能远不足以支撑 PC。","text":"IBM PC 及其兼容机系统。"},{"isCorrect":true,"rationale":"Intel 与 Busicom 合作设计了这款 4 位 CPU，最初是为了满足后者的计算器生产需求。","text":"日本 Busicom 公司的计算器产品线。"},{"isCorrect":false,"rationale":"Xerox Alto 使用的是定制硬件，而 4004 主要是通用的逻辑处理芯片。","text":"Xerox Alto 原型机中的高分辨率位图控制器。"}],"hint":"这个设备的初衷是为了处理复杂的算术逻辑，而不是作为通用的桌面电脑。","question":"根据提供的材料，Intel 4004 作为世界上第一款微处理器，其最初的设计目的是用于什么设备？"}];
        let currentIndex = 0;
        let mode = 'quiz';
        let state = quizData.map(() => ({ selectedIndex: null, hintVisible: false }));

        function getStats() {
            const answered = state.filter((s) => s.selectedIndex !== null).length;
            const correct = state.filter((s, i) => s.selectedIndex !== null && quizData[i].answerOptions[s.selectedIndex].isCorrect).length;
            const wrong = state.filter((s, i) => s.selectedIndex !== null && !quizData[i].answerOptions[s.selectedIndex].isCorrect).length;
            const skipped = quizData.length - answered;
            const accuracy = answered > 0 ? Math.round((correct / answered) * 100) : 0;
            return { answered, correct, wrong, skipped, accuracy };
        }

        function shuffleAnswers() {
            quizData.forEach((q) => {
                for (let i = q.answerOptions.length - 1; i > 0; i -= 1) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.answerOptions[i], q.answerOptions[j]] = [q.answerOptions[j], q.answerOptions[i]];
                }
            });
        }

        function shuffleQuestions() {
            for (let i = quizData.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
            }
        }

        function resetState() {
            state = quizData.map(() => ({ selectedIndex: null, hintVisible: false }));
        }

        function renderQuestion() {
            const q = quizData[currentIndex];
            const s = state[currentIndex];
            const content = document.getElementById('quiz-content');
            const results = document.getElementById('results-content');
            const hintBox = document.getElementById('hint-box');
            const nav = document.querySelector('.navigation');
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');

            let optionsHtml = '';
            const correctIndex = q.answerOptions.findIndex((o) => o.isCorrect);
            const selectedCorrect = s.selectedIndex !== null && q.answerOptions[s.selectedIndex].isCorrect;
            q.answerOptions.forEach((opt, idx) => {
                const isSelected = s.selectedIndex === idx;
                const statusClass = isSelected ? (opt.isCorrect ? 'correct' : 'incorrect') : '';
                const selectedClass = isSelected ? 'selected' : '';
                const revealCorrect = (s.selectedIndex !== null && !selectedCorrect && opt.isCorrect) || (mode === 'review' && opt.isCorrect);
                const revealClass = revealCorrect ? 'revealed-correct' : '';

                optionsHtml += `
                    <li class="option-item ${selectedClass} ${statusClass} ${revealClass}" onclick="selectOption(${idx})">
                        <div class="option-label">
                            <span>${String.fromCharCode(65 + idx)}. ${opt.text}</span>
                        </div>
                        <div class="feedback-state">
                            ${opt.isCorrect ? '✓ Right answer' : '✕ Not quite'}
                        </div>
                        ${opt.rationale ? '<div class="rationale">' + opt.rationale + '</div>' : ''}
                    </li>
                `;
            });

            const stats = getStats();

            content.innerHTML = `
                <div class="progress-container">
                    <div class="progress-text">${currentIndex + 1} / ${quizData.length}</div>
                    <div class="status-bar">
                        <div class="status-item status-correct">
                            <span>✓</span>
                            <span>${stats.correct}</span>
                        </div>
                        <div class="status-item status-wrong">
                            <span>✕</span>
                            <span>${stats.wrong}</span>
                        </div>
                    </div>
                </div>
                <div class="question-text">${q.question}</div>
                <ul class="options-list">
                    ${optionsHtml}
                </ul>
            `;

            // Update Hint Box
            const hintText = document.getElementById('hint-text');
            hintText.innerText = q.hint || 'No hint available for this question.';
            if (s.hintVisible) {
                hintBox.classList.add('active');
            } else {
                hintBox.classList.remove('active');
            }

            results.classList.add('hidden');
            content.classList.remove('hidden');
            hintBox.classList.remove('hidden');
            nav.classList.remove('hidden');

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = false;
            if (mode === 'review') {
                nextBtn.innerText = currentIndex === quizData.length - 1 ? 'Back to Results' : 'Next';
            } else {
                nextBtn.innerText = currentIndex === quizData.length - 1 ? 'Finish' : 'Next';
            }
            document.getElementById('hint-icon-arrow').innerText = s.hintVisible ? '▲' : '▼';
        }

        function selectOption(idx) {
            if (mode !== 'quiz') return;
            if (state[currentIndex].selectedIndex !== null) return; // Prevent re-selection
            state[currentIndex].selectedIndex = idx;
            renderQuestion();
        }

        function toggleHint() {
            if (mode === 'results') return;
            state[currentIndex].hintVisible = !state[currentIndex].hintVisible;
            renderQuestion();
        }

        function renderResults() {
            const stats = getStats();
            const content = document.getElementById('quiz-content');
            const results = document.getElementById('results-content');
            const hintBox = document.getElementById('hint-box');
            const nav = document.querySelector('.navigation');

            const score = `${stats.correct} / ${quizData.length}`;

            results.innerHTML = `
                <div class="results-screen">
                    <div>
                        <h1 class="results-title">You did it! Quiz Complete.</h1>
                        <p class="results-subtitle">Review your score or take another run.</p>
                    </div>
                    <div class="results-grid">
                        <div class="result-card">
                            <div class="result-label">Score</div>
                            <div class="result-value">${score}</div>
                        </div>
                        <div class="result-card">
                            <div class="result-label">Accuracy</div>
                            <div class="result-value">${stats.accuracy}%</div>
                        </div>
                        <div class="result-card">
                            <div class="result-metrics">
                                <div>Right <strong>${stats.correct}</strong></div>
                                <div>Wrong <strong>${stats.wrong}</strong></div>
                                <div>Skipped <strong>${stats.skipped}</strong></div>
                            </div>
                        </div>
                    </div>
                    <div class="results-actions">
                        <button id="review-btn" class="btn btn-ghost">Review Quiz</button>
                        <button id="retake-btn" class="btn btn-next">Retake Quiz</button>
                    </div>
                </div>
            `;

            content.classList.add('hidden');
            results.classList.remove('hidden');
            hintBox.classList.add('hidden');
            nav.classList.add('hidden');

            document.getElementById('review-btn').onclick = () => {
                mode = 'review';
                currentIndex = 0;
                renderQuestion();
            };

            document.getElementById('retake-btn').onclick = () => {
                mode = 'quiz';
                currentIndex = 0;
                shuffleQuestions();
                shuffleAnswers();
                resetState();
                renderQuestion();
            };
        }

        document.getElementById('prev-btn').onclick = () => {
            if (mode === 'results') return;
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        };

        document.getElementById('next-btn').onclick = () => {
            if (mode === 'results') return;
            if (mode === 'review') {
                if (currentIndex < quizData.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    mode = 'results';
                    renderResults();
                }
                return;
            }
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                mode = 'results';
                renderResults();
            }
        };

        document.getElementById('hint-toggle').onclick = toggleHint;

        renderQuestion();
    </script>
</body>
</html>
