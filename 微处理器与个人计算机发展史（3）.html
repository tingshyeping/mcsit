<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微处理器与个人计算机发展史 (3)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        :root {
            --bg: #f6f1e7;
            --bg-deep: #efe4d6;
            --ink: #171717;
            --muted: #5b5b5b;
            --accent: #d3542c;
            --accent-light: #ff8f5a;
            --accent-dark: #b14320;
            --teal: #1f6f78;
            --card: #fff7ef;
            --stroke: #e3d6c5;
            --shadow: 0 18px 40px rgba(23, 23, 23, 0.12);
            --radius-sm: 10px;
            --radius-md: 12px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --radius-2xl: 22px;
            --space-1: 6px;
            --space-2: 8px;
            --space-3: 10px;
            --space-4: 12px;
            --space-5: 14px;
            --space-6: 16px;
            --space-7: 18px;
            --space-8: 20px;
            --space-9: 24px;
            --space-10: 32px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'IBM Plex Sans', sans-serif;
            --error: #b54832;
        }

        body {
            font-family: var(--font-body);
            background:
                radial-gradient(240px 140px at 10% -10%, #ffd2b9 0%, transparent 70%),
                radial-gradient(220px 160px at 90% 0%, #cfe7e6 0%, transparent 65%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--ink);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            padding: var(--space-10) var(--space-8);
            box-sizing: border-box;
            background: var(--card);
            border-radius: var(--radius-2xl);
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow);
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .progress-text {
            color: var(--muted);
            font-size: 0.9em;
        }

        .status-bar {
            display: flex;
            gap: 16px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-correct { color: var(--teal); }
        .status-wrong { color: var(--error); }

        .question-text {
            font-family: var(--font-display);
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .options-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            background-color: #fff;
            border: 1px solid var(--stroke);
            padding: var(--space-4) var(--space-6);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item:hover:not(.selected) {
            background-color: var(--card);
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .option-item.selected.correct {
            background-color: rgba(31, 111, 120, 0.12);
            border-color: var(--teal);
        }

        .option-item.selected.incorrect {
            background-color: rgba(181, 72, 50, 0.12);
            border-color: var(--error);
        }

        .option-item.revealed-correct {
            border-color: rgba(31, 111, 120, 0.5);
            box-shadow: inset 0 0 0 1px rgba(31, 111, 120, 0.16);
        }

        .option-label {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feedback-state {
            font-weight: bold;
            font-size: 0.9em;
            display: none;
        }

        .selected .feedback-state {
            display: block;
        }

        .revealed-correct .feedback-state {
            display: block;
        }

        .correct .feedback-state { color: var(--teal); }
        .incorrect .feedback-state { color: var(--error); }
        .revealed-correct .feedback-state { color: var(--teal); }

        .rationale {
            font-size: 0.95em;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.5;
            display: none;
        }

        .selected .rationale {
            display: block;
        }

        .revealed-correct .rationale {
            display: block;
        }
        .hint-toggle {
            border: 1px solid var(--stroke);
            color: var(--muted);
            cursor: pointer;
            padding: var(--space-2) var(--space-6);
            border-radius: var(--radius-md);
            background-color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hint-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .hint-content {
            margin-top: 32px;
            padding: var(--space-6);
            background-color: #fff;
            border: 1px solid var(--stroke);
            border-radius: var(--radius-lg);
            font-size: 0.95em;
            color: var(--muted);
            display: none;
            align-items: flex-start;
            gap: 16px;
        }

        .hint-content.active {
            display: flex;
        }

        .hint-icon-box {
            color: var(--accent-dark);
            font-size: 1.2em;
            margin-top: -2px;
        }

        .navigation {
            margin-top: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-7);
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-prev {
            background-color: #fff;
            color: var(--ink);
            border-color: var(--stroke);
        }

        .btn-prev:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .btn-next {
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            color: #fff;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .results-screen {
            display: flex;
            flex-direction: column;
            gap: var(--space-8);
        }

        .results-title {
            font-family: var(--font-display);
            font-size: 2.1em;
            margin: 0;
        }

        .results-subtitle {
            color: var(--muted);
            margin: 0;
            font-size: 1em;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-6);
        }

        .result-card {
            padding: var(--space-6);
            border-radius: var(--radius-xl);
            background: #fff;
            border: 1px solid var(--stroke);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .result-label {
            color: var(--muted);
            font-size: 0.95em;
        }

        .result-value {
            font-size: 2em;
            font-family: var(--font-display);
        }

        .result-metrics {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            color: var(--muted);
            font-size: 0.95em;
        }

        .results-actions {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
        }

        .btn-ghost {
            background-color: transparent;
            border: 1px solid var(--stroke);
            color: var(--ink);
        }

        .hidden { display: none; }

        @media (max-width: 900px) {
            .quiz-container {
                margin: var(--space-8);
                max-width: 100%;
            }
        }

        @media (max-width: 720px) {
            .quiz-container {
                padding: var(--space-8) var(--space-6);
            }

            .question-text {
                font-size: 1.3em;
            }

            .option-item {
                padding: var(--space-4);
            }
        }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
            }

            .quiz-container {
                margin: var(--space-6);
                padding: var(--space-7) var(--space-5);
            }

            .progress-container {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-3);
            }

            .navigation {
                flex-direction: column;
                align-items: stretch;
                gap: var(--space-4);
            }

            .nav-buttons {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .hint-toggle {
                justify-content: space-between;
            }

            .results-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="quiz-content">
            <!-- Dynamic Content -->
        </div>
        <div id="results-content" class="hidden"></div>

        <div id="hint-box" class="hint-content">
            <div class="hint-icon-box">💡</div>
            <div id="hint-text"></div>
        </div>

        <div class="navigation">
            <button id="hint-toggle" class="hint-toggle">
                <span>Hint</span>
                <span id="hint-icon-arrow">▼</span>
            </button>
            <div class="nav-buttons">
                <button id="prev-btn" class="btn btn-prev">Previous</button>
                <button id="next-btn" class="btn btn-next">Next</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [{"answerOptions":[{"isCorrect":false,"rationale":"虽然硬件测试在工程中很重要，但理论计算机科学更侧重于抽象层面的研究。","text":"物理实验与硬件测试"},{"isCorrect":false,"rationale":"编写程序是应用，而理论研究是为了理解这些活动背后的数学和逻辑本质。","text":"程序编写与调试"},{"isCorrect":true,"rationale":"理论计算机科学通过建立机器、语言或系统的模型，并利用分析方法研究其效率和局限性。","text":"模型与分析方法"},{"isCorrect":false,"rationale":"这些属于人机交互或软件工程的实践领域，而非理论计算机科学的核心范畴。","text":"市场调查与用户体验"}],"hint":"考虑理论研究中如何处理复杂系统的抽象表示。","question":"根据教材描述，理论计算机科学主要使用哪两种手段来研究计算机和计算？"},{"answerOptions":[{"isCorrect":true,"rationale":"卵石游戏在有向无环图上进行，通过在顶点放置卵石来模拟寄存器占用，从而研究资源平衡。","text":"卵石游戏（Pebble Game）"},{"isCorrect":false,"rationale":"图着色主要用于研究调度和分配问题，而非直接用于时空权衡的积不等式研究。","text":"图着色游戏"},{"isCorrect":false,"rationale":"这是研究电路复杂性的工具，而非 70 年代产生的专门用于时空权衡的模型。","text":"布尔电路博弈"},{"isCorrect":false,"rationale":"虽然计算复杂性中有博弈模型，但专门研究时空权衡的经典模型不是这个名称。","text":"分层游戏"}],"hint":"这个游戏的名称与一种可以在图的顶点上移动的小石子有关。","question":"在 20 世纪 70 年代，哪种游戏被开发出来用于研究算法中“空间”与“时间”的权衡（Tradeoffs）？"},{"answerOptions":[{"isCorrect":false,"rationale":"RAM 的基本命令中没有专门的清空命令，通常通过写入 0 或执行其他逻辑来实现。","text":"清空指定内存地址的数据内容"},{"isCorrect":false,"rationale":"这是指令循环的自动过程，而非 $READ$ 命令执行的具体数据操作。","text":"增加程序计数器（prog ctr）的值而不进行数据传输"},{"isCorrect":false,"rationale":"这是 $WRITE$ 命令的功能，而非 $READ$。","text":"将寄存器中的值写入指定地址的内存单元"},{"isCorrect":true,"rationale":"在 RAM 模型中，$READ$ 命令的作用是将特定地址的数据读取并反映在输出字中。","text":"将指定地址内存单元的值更改为输出数据字 $out\\ wrd$ 的值"}],"hint":"考虑数据是从内存流向 CPU 还是从 CPU 流向内存。","question":"在有界内存随机存取机（RAM）模型中，执行 $READ$ 命令会导致什么结果？"},{"answerOptions":[{"isCorrect":false,"rationale":"这是整数加法的结果，没有考虑到模 5 的除余要求。","text":"$7$"},{"isCorrect":true,"rationale":"$3 + 4 = 7$，而 $7 \\div 5$ 的余数是 $2$，因此结果为 $2$。","text":"$2$"},{"isCorrect":false,"rationale":"模运算只有在和是 5 的倍数时结果才为 0。","text":"$0$"},{"isCorrect":false,"rationale":"这是 $(3 + 3) \\pmod 5$ 或类似运算的结果，而非 $3 \\oplus 4$。","text":"$1$"}],"hint":"将两数相加后求除以 5 的余数。","question":"假设集合 $S = \\{0, 1, 2, 3, 4\\}$，定义运算符 $\\oplus$ 为模 5 加法。计算 $3 \\oplus 4$ 的结果是多少？"},{"answerOptions":[{"isCorrect":false,"rational :false,"rationale":"虽然计算机内部处理二进制，但输入设备可以捕获图像、条码或声音等多种形式。","text":"它们仅能识别二进制代码"},{"isCorrect":true,"rationale":"直接输入设备旨在提高自动化程度并减少人为错误。","text":"数据通过机器或设备直接获取，人的干预极少"},{"isCorrect":false,"rationale":"这是手动输入设备（如键盘）的特征。","text":"数据必须由操作员手动逐字敲击进入"}],"hint":"关注人类在数据录入过程中的参与程度。","question":"在输入设备分类中，“直接输入设备”（Direct input devices）的定义特征是什么？"},{"answerOptions":[{"isCorrect":true,"rationale":"通过更自然的形状减轻手腕和手的压力，从而预防长期劳损。","text":"减少与打字相关的健康问题（如重复性劳损 RSI）"},{"isCorrect":false,"rationale":"这是三防或防水键盘的设计重点。","text":"使键盘能够抵抗液体溅洒"},{"isCorrect":false,"rationale":"人体工程学键盘往往比标准键盘体积更大，因为需要额外的支撑和特定角度。","text":"减小键盘在桌面上的占地面积"},{"isCorrect":false,"rationale":"那是背光键盘的功能，而非人体工程学的主要目标。","text":"提高打字员在黑暗环境下的可见度"}],"hint":"考虑长期使用电脑办公对人体骨骼和肌肉的影响。","question":"人体工程学键盘（Ergonomic Keyboards）的设计初衷主要是为了解决什么问题？"},{"answerOptions":[{"isCorrect":false,"rationale":"恰恰相反，节省桌面空间是光笔的一个优点。","text":"在桌面空间有限的情况下无法使用"},{"isCorrect":false,"rationale":"来源材料指出光笔比鼠标更直接、更精确。","text":"比使用鼠标更不精确"},{"isCorrect":true,"rationale":"长时间保持这种姿势会导致手臂疲劳，这是人体工程学上的一个显著缺点。","text":"需要长时间抬起手对着屏幕，使用感不适"},{"isCorrect":false,"rationale":"光笔主要用于在屏幕上直接操作，非常适合图形交互。","text":"它无法在图形用户界面环境下工作"}],"hint":"想一想如果你必须连续几个小时抬高手臂指着墙壁会是什么感觉。","question":"关于“光笔”（Light Pen）这一输入设备，以下哪项描述是其缺点？"},{"answerOptions":[{"isCorrect":false,"rationale":"Altair 8800 最初主要通过开关和灯光进行交互，并未配备鼠标。","text":"1975 年，随 Altair 8800 一起面世"},{"isCorrect":false,"rationale":"费德里科·法金是微处理器的主要设计者，而非鼠标的初创者。","text":"1971 年，由 Federico Faggin 在 Intel 发明"},{"isCorrect":true,"rationale":"道格拉斯·恩格尔巴特在 1963 年左右发明了鼠标，并在 1970 年获得专利。","text":"1963 年（或 1967 年描述），由 Douglas Engelbart 发明"},{"isCorrect":false,"rationale":"曼彻斯特团队主要关注第一台 SPC 电子机器的实现。","text":"1948 年，由曼彻斯特大学团队发明"}],"hint":"发明者是来自斯坦福研究所（SRI）的一位先驱。","question":"根据材料，鼠标这种设备最初是在哪一年由谁发明的？"},{"answerOptions":[{"isCorrect":false,"rationale":"IBM PC 发布较晚（1981 年），虽然影响巨大，但不是第一款成功的家庭用户机。","text":"IBM PC"},{"isCorrect":false,"rationale":"Z80 是 CPU，虽然流行，但本身不是一款针对家庭用户的完整电脑产品名。","text":"Z80 嵌入式系统"},{"isCorrect":false,"rationale":"麦金塔发布于 1984 年，是以图形界         let currentIndex = 0;
        let mode = 'quiz';
        let state = quizData.map(() => ({ selectedIndex: null, hintVisible: false }));

        function getStats() {
            const answered = state.filter((s) => s.selectedIndex !== null).length;
            const correct = state.filter((s, i) => s.selectedIndex !== null && quizData[i].answerOptions[s.selectedIndex].isCorrect).length;
            const wrong = state.filter((s, i) => s.selectedIndex !== null && !quizData[i].answerOptions[s.selectedIndex].isCorrect).length;
            const skipped = quizData.length - answered;
            const accuracy = answered > 0 ? Math.round((correct / answered) * 100) : 0;
            return { answered, correct, wrong, skipped, accuracy };
        }

        function shuffleAnswers() {
            quizData.forEach((q) => {
                for (let i = q.answerOptions.length - 1; i > 0; i -= 1) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.answerOptions[i], q.answerOptions[j]] = [q.answerOptions[j], q.answerOptions[i]];
                }
            });
        }

        function shuffleQuestions() {
            for (let i = quizData.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
            }
        }

        function resetState() {
            state = quizData.map(() => ({ selectedIndex: null, hintVisible: false }));
        }

        function renderQuestion() {
            const q = quizData[currentIndex];

            const content = document.getElementById('quiz-content');

            let optionsHtml = '';

            const selectedCorrect = s.selectedIndex !== null && q.answerOptions[s.selectedIndex].isCorrect;
            q.answerOptions.forEach((opt, idx) => {
                const isSelected = s.selectedIndex === idx;
                const statusClass = isSelected ? (opt.isCorrect ? 'correct' : 'incorrect') : '';
                const selectedClass = isSelected ? 'selected' : '';
                const revealCorrect = (s.selectedIndex !== null && !selectedCorrect && opt.isCorrect) || (mode === 'review' && opt.isCorrect);
                const revealClass = revealCorrect ? 'revealed-correct' : '';

                optionsHtml += `
                    <li class="option-item ${selectedClass} ${statusClass} ${revealClass}" onclick="selectOption(${idx})">
                        <div class="option-label">
                            <span>${String.fromCharCode(65 + idx)}. ${opt.text}</span>
                        </div>
                        <div class="feedback-state">
                            ${opt.isCorrect ? '✓ Right answer' : '✕ Not quite'}

                `;

                            <span>${stats.correct}</span>
                        </div>
                        <div class="status-item status-wrong">
                            <span>✕</span>
                            <span>${stats.wrong}</span>
                        </div>
                    </div>
                </div>
                <div class="question-text">${q.question}</div>
                <ul class="options-list">
                    ${optionsHtml}
                </ul>
            `;

            // Update Hint Box
            const hintText = document.getElementById('hint-text');
            hintText.innerText = q.hint || 'No hint available for this question.';
            if (s.hintVisible) {
                hintBox.classList.add('active');
            } else {
                hintBox.classList.remove('active');
            }

            results.classList.add('hidden');
            content.classList.remove('hidden');
            hintBox.classList.remove('hidden');
            nav.classList.remove('hidden');

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = false;
            if (mode === 'review') {
                nextBtn.innerText = currentIndex === quizData.length - 1 ? 'Back to Results' : 'Next';
            } else {
                nextBtn.innerText = currentIndex === quizData.length - 1 ? 'Finish' : 'Next';
            }
            document.getElementById('hint-icon-arrow').innerText = s.hintVisible ? '▲' : '▼';
        }

        function selectOption(idx) {
            if (mode !== 'quiz') return;
            if (state[currentIndex].selectedIndex !== null) return; // Prevent re-selection
            state[currentIndex].selectedIndex = idx;
            renderQuestion();
        }

        function toggleHint() {
            if (mode === 'results') return;
            state[currentIndex].hintVisible = !state[currentIndex].hintVisible;
            renderQuestion();
        }

        function renderResults() {
            const stats = getStats();
            const content = document.getElementById('quiz-content');
            const results = document.getElementById('results-content');
            const hintBox = document.getElementById('hint-box');
            const nav = document.querySelector('.navigation');

            const score = `${stats.correct} / ${quizData.length}`;

            results.innerHTML = `
                <div class="results-screen">
                    <div>
                        <h1 class="results-title">You did it! Quiz Complete.</h1>
                        <p class="results-subtitle">Review your score or take another run.</p>
                    </div>
                    <div class="results-grid">
                        <div class="result-card">
                            <div class="result-label">Score</div>
                            <div class="result-value">${score}</div>
                        </div>
                        <div class="result-card">
                            <div class="result-label">Accuracy</div>
                            <div class="result-value">${stats.accuracy}%</div>
                        </div>
                        <div class="result-card">
                            <div class="result-metrics">
                                <div>Right <strong>${stats.correct}</strong></div>
                                <div>Wrong <strong>${stats.wrong}</strong></div>
                                <div>Skipped <strong>${stats.skipped}</strong></div>
                            </div>
                        </div>
                    </div>
                    <div class="results-actions">
                        <button id="review-btn" class="btn btn-ghost">Review Quiz</button>
                        <button id="retake-btn" class="btn btn-next">Retake Quiz</button>
                    </div>
                </div>
            `;

            content.classList.add('hidden');
            results.classList.remove('hidden');
            hintBox.classList.add('hidden');
            nav.classList.add('hidden');

            document.getElementById('review-btn').onclick = () => {
                mode = 'review';
                currentIndex = 0;
                renderQuestion();
            };

            document.getElementById('retake-btn').onclick = () => {
                mode = 'quiz';
                currentIndex = 0;
                shuffleQuestions();
                shuffleAnswers();
                resetState();
                renderQuestion();
            };
        }

        document.getElementById('prev-btn').onclick = () => {
            if (mode === 'results') return;
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        };

        document.getElementById('next-btn').onclick = () => {
            if (mode === 'results') return;
            if (mode === 'review') {
                if (currentIndex < quizData.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    mode = 'results';
                    renderResults();
                }
                return;
            }
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                mode = 'results';
                renderResults();
            }
        };

        document.getElementById('hint-toggle').onclick = toggleHint;

        renderQuestion();
    </script>
</body>
</html>
