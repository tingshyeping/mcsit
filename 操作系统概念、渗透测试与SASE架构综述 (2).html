<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作系统概念、渗透测试与SASE架构综述 (2)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        :root {
            --bg: #f6f1e7;
            --bg-deep: #efe4d6;
            --ink: #171717;
            --muted: #5b5b5b;
            --accent: #d3542c;
            --accent-light: #ff8f5a;
            --accent-dark: #b14320;
            --teal: #1f6f78;
            --card: #fff7ef;
            --stroke: #e3d6c5;
            --shadow: 0 18px 40px rgba(23, 23, 23, 0.12);
            --radius-sm: 10px;
            --radius-md: 12px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --radius-2xl: 22px;
            --space-1: 6px;
            --space-2: 8px;
            --space-3: 10px;
            --space-4: 12px;
            --space-5: 14px;
            --space-6: 16px;
            --space-7: 18px;
            --space-8: 20px;
            --space-9: 24px;
            --space-10: 32px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'IBM Plex Sans', sans-serif;
            --error: #b54832;
        }

        body {
            font-family: var(--font-body);
            background:
                radial-gradient(240px 140px at 10% -10%, #ffd2b9 0%, transparent 70%),
                radial-gradient(220px 160px at 90% 0%, #cfe7e6 0%, transparent 65%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--ink);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            padding: var(--space-10) var(--space-8);
            box-sizing: border-box;
            background: var(--card);
            border-radius: var(--radius-2xl);
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow);
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .progress-text {
            color: var(--muted);
            font-size: 0.9em;
        }

        .status-bar {
            display: flex;
            gap: 16px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-correct { color: var(--teal); }
        .status-wrong { color: var(--error); }

        .question-text {
            font-family: var(--font-display);
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .options-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            background-color: #fff;
            border: 1px solid var(--stroke);
            padding: var(--space-4) var(--space-6);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item:hover:not(.selected) {
            background-color: var(--card);
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .option-item.selected.correct {
            background-color: rgba(31, 111, 120, 0.12);
            border-color: var(--teal);
        }

        .option-item.selected.incorrect {
            background-color: rgba(181, 72, 50, 0.12);
            border-color: var(--error);
        }

        .option-item.revealed-correct {
            border-color: rgba(31, 111, 120, 0.5);
            box-shadow: inset 0 0 0 1px rgba(31, 111, 120, 0.16);
        }

        .option-label {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feedback-state {
            font-weight: bold;
            font-size: 0.9em;
            display: none;
        }

        .selected .feedback-state {
            display: block;
        }

        .revealed-correct .feedback-state {
            display: block;
        }

        .correct .feedback-state { color: var(--teal); }
        .incorrect .feedback-state { color: var(--error); }
        .revealed-correct .feedback-state { color: var(--teal); }

        .rationale {
            font-size: 0.95em;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.5;
            display: none;
        }

        .selected .rationale {
            display: block;
        }

        .revealed-correct .rationale {
            display: block;
        }
        .hint-toggle {
            border: 1px solid var(--stroke);
            color: var(--muted);
            cursor: pointer;
            padding: var(--space-2) var(--space-6);
            border-radius: var(--radius-md);
            background-color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hint-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .hint-content {
            margin-top: 32px;
            padding: var(--space-6);
            background-color: #fff;
            border: 1px solid var(--stroke);
            border-radius: var(--radius-lg);
            font-size: 0.95em;
            color: var(--muted);
            display: none;
            align-items: flex-start;
            gap: 16px;
        }

        .hint-content.active {
            display: flex;
        }

        .hint-icon-box {
            color: var(--accent-dark);
            font-size: 1.2em;
            margin-top: -2px;
        }

        .navigation {
            margin-top: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-7);
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-prev {
            background-color: #fff;
            color: var(--ink);
            border-color: var(--stroke);
        }

        .btn-prev:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .btn-next {
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            color: #fff;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .results-screen {
            display: flex;
            flex-direction: column;
            gap: var(--space-8);
        }

        .results-title {
            font-family: var(--font-display);
            font-size: 2.1em;
            margin: 0;
        }

        .results-subtitle {
            color: var(--muted);
            margin: 0;
            font-size: 1em;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-6);
        }

        .result-card {
            padding: var(--space-6);
            border-radius: var(--radius-xl);
            background: #fff;
            border: 1px solid var(--stroke);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .result-label {
            color: var(--muted);
            font-size: 0.95em;
        }

        .result-value {
            font-size: 2em;
            font-family: var(--font-display);
        }

        .result-metrics {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            color: var(--muted);
            font-size: 0.95em;
        }

        .results-actions {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
        }

        .btn-ghost {
            background-color: transparent;
            border: 1px solid var(--stroke);
            color: var(--ink);
        }

        .hidden { display: none; }

        @media (max-width: 900px) {
            .quiz-container {
                margin: var(--space-8);
                max-width: 100%;
            }
        }

        @media (max-width: 720px) {
            .quiz-container {
                padding: var(--space-8) var(--space-6);
            }

            .question-text {
                font-size: 1.3em;
            }

            .option-item {
                padding: var(--space-4);
            }
        }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
            }

            .quiz-container {
                margin: var(--space-6);
                padding: var(--space-7) var(--space-5);
            }

            .progress-container {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-3);
            }

            .navigation {
                flex-direction: column;
                align-items: stretch;
                gap: var(--space-4);
            }

            .nav-buttons {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .hint-toggle {
                justify-content: space-between;
            }

            .results-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="quiz-content">
            <!-- Dynamic Content -->
        </div>
        <div id="results-content" class="hidden"></div>

        <div id="hint-box" class="hint-content">
            <div class="hint-icon-box">💡</div>
            <div id="hint-text"></div>
        </div>

        <div class="navigation">
            <button id="hint-toggle" class="hint-toggle">
                <span>Hint</span>
                <span id="hint-icon-arrow">▼</span>
            </button>
            <div class="nav-buttons">
                <button id="prev-btn" class="btn btn-prev">Previous</button>
                <button id="next-btn" class="btn btn-next">Next</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [{"answerOptions":[{"isCorrect":true,"rationale":"SASE 的核心在于网络（如 SD-WAN）与安全（如 ZTNA、CASB）在云端的融合。","text":"将网络功能与安全功能统一为单一云原生服务模型的架构"},{"isCorrect":false,"rationale":"SASE 利用互联网、LTE 等多种连接方式，而非仅限于专用网络。","text":"一种独立于互联网运行的封闭式专用企业广域网"},{"isCorrect":false,"rationale":"VPN 仅是 SASE 试图改进或取代的传统 perimeter-based 模型的一部分。","text":"一种仅通过 VPN 连接远程用户的传统网络安全架构"},{"isCorrect":false,"rationale":"SASE 旨在摆脱以数据中心为中心的模型，转向保护分布式用户和云资源。","text":"一种专门用于保护本地数据中心物理服务器的防火墙技术"}],"hint":"考虑现代网络如何将连接性与多层安全保护相结合。","question":"根据 Hughes 的指南，安全访问服务边缘（SASE）的核心定义是什么？"},{"answerOptions":[{"isCorrect":false,"rationale":"SD-WAN 侧重于网络连接管理，而不是数据备份管理。","text":"为本地数据库提供自动化的加密备份服务"},{"isCorrect":false,"rationale":"识别“影子 IT”通常是云访问安全代理（CASB）的作用。","text":"监控并识别员工使用的未经授权的云端应用程序"},{"isCorrect":false,"rationale":"这是远程浏览器隔离（RBI）的功能，而非 SD-WAN 的主要职责。","text":"在浏览器级别隔离恶意脚本以保护终端设备"},{"isCorrect":true,"rationale":"SD-WAN 作为网络基础，通过软件定义的手段确保关键任务流量的优先级。","text":"管理和优化流量路由，根据应用需求智能分配带宽"}],"hint":"关注该技术在 Wide Area Network 中作为“网络基础”的角色。","question":"在 SASE 架构中，SD-WAN 主要负责解决什么问题？"},{"answerOptions":[{"isCorrect":false,"rationale":"连接介质不是两者的本质区别，访问控制逻辑才是。","text":"VPN 通过物理硬件连接，而 ZTNA 必须通过卫星连接"},{"isCorrect":false,"rationale":"两者都需要身份验证，但验证的广度和持续性不同。","text":"VPN 不需要任何身份验证，而 ZTNA 需要"},{"isCorrect":false,"rationale":"ZTNA 被视为 VPN 的替代方案，支持更灵活的远程和本地混合工作模式。","text":"ZTNA 只能在办公室内使用，而 VPN 仅用于远程办公"},{"isCorrect":true,"rationale":"ZTNA 基于身份和上下文持续验证，而不因用户已接入网络就授予完全信任。","text":"VPN 假设内网用户是可信的，而 ZTNA 坚持“从不信任，始终验证”"}],"hint":"思考对访问者身份及其权限的验证频率和逻辑。","question":"零信任网络访问（ZTNA）与传统 VPN 的根本区别在于哪一点？"},{"answerOptions":[{"isCorrect":true,"rationale":"这种强制回传架构在访问云端资源时会增加不必要的路径和延迟。","text":"流量必须先返回中央数据中心进行安全检查，再转发到云应用"},{"isCorrect":false,"rationale":"这是一种对物理拓扑的误解，问题在于逻辑上的中心化安全校验。","text":"因为所有云端流量都必须经过物理光纤中的固定闭环"},{"isCorrect":false,"rationale":"性能下降主要源于路由效率低下，而非协议自带的丢包设计。","text":"因为 VPN 协议本身会随机丢弃大约 $10\\%$ 的数据包"},{"isCorrect":false,"rationale":"云应用旨在被广泛访问，发卡弯是企业内部网络策略导致的瓶颈。","text":"云服务商会拒绝所有来自非数据中心 IP 地址的连接请求"}],"hint":"考虑数 :[{"isCorrect":true,"rationale":"这是一种更精细、更高效的内存管理方式，符合虚拟内存的逻辑。","text":"现在的重点是交换“页面（Pages）”而非整个“进程（Processes）”"},{"isCorrect":false,"rationale":"交换是大多数通用操作系统（如 Linux、Windows）的基本功能。","text":"规定只能在基于 Java 的操作系统中进行交换"},{"isCorrect":false,"rationale":"交换依然存在，只是实现方式发生了变化。","text":"完全取消了交换，因为现代内存已经足够大"},{"isCorrect":false,"rationale":"交换涉及主存与辅存（如磁盘或 SSD）之间的数据移动。","text":"交换现在只能在 CPU 的缓存之间进行"}],"hint":"考虑内存管理的粒度，是移动整个大块还是更小的固定单位？","question":"在操作系统中，用于管理主内存执行过程的“交换（Swapping）”概念，在第十版教材中发生了什么变化？"},{"answerOptions":[{"isCorrect":true,"rationale":"虚拟机允许在单台设备上安全地模拟多台受害机和攻击机。","text":"虚拟机（Virtual Machines）"},{"isCorrect":false,"rationale":"这是不道德且可能非法的，作者强调了合法性和实验室环境。","text":"仅在公共 Wi-Fi 网络上进行测试"},{"isCorrect":false,"rationale":"虽然可行，但本地虚拟机是书中最先且最核心的推荐方式。","text":"基于云端的超级计算机群"},{"isCorrect":false,"rationale":"这对于普通学习者来说成本太高，不符合书中“按自己的节奏”的建议。","text":"物理隔离的机房"}],"hint":"这是一种可以在一台笔记本电脑上运行多个“虚拟”操作系统的技术。","question":"关于 Kali Linux 实验室环境的搭建，作者 Glen D. Singh 建议使用什么工具？"},{"answerOptions":[{"isCorrect":false,"rationale":"路由策略由 SD-WAN 决定，FWaaS 负责检查和过滤流量。","text":"它能够自动将所有的网络流量重定向至卫星"},{"isCorrect":false,"rationale":"这属于物理安全，不是网络防火墙的功能。","text":"FWaaS 可以物理抵挡针对办公楼的炸弹袭击"},{"isCorrect":false,"rationale":"作为云服务，它运行在云服务商的高能效数据中心，但依然需要能源。","text":"FWaaS 不需要电力供应即可运行"},{"isCorrect":true,"rationale":"云原生的特性消除了对特定物理位置的依赖，实现了真正的移动办公保护。","text":"它是云交付的，无论用户身在何处都能应用一致的安全规则"}],"hint":"重点在于它的部署位置（云端）及其对移动用户的覆盖能力。","question":"SASE 方案中的“防火墙即服务（FWaaS）”与传统硬件防火墙相比，主要优势是？"},{"answerOptions":[{"isCorrect":true,"rationale":"ASLR 使得系统组件的加载地址每次都不同，让攻击者难以精准跳转。","text":"通过预测内存地址来利用缓冲区溢出"},{"isCorrect":false,"rationale":"这是物理失窃，防御它需要加密和物理锁。","text":"从物理上偷走服务器的硬盘"},{"isCorrect":false,"rationale":"这是钓鱼/伪造攻击，与系统级内存保护无关。","text":"伪造员工的电子邮件地址"},{"isCorrect":false,"rationale":"密码破解与内存布局随机化无关。","text":"强力破解管理员密码"}],"hint":"考虑如果内存位置不再固定，攻击者的 shellcode 还能轻易找到目标吗？","question":"在 Windows 中执行特权提升时，ASLR（地址空间布局随机化）旨在防御哪种攻击？"},{"answerOptions":[{"isCorrect":false,"rationale":"这不是 SASE 框架中标准的安全术语缩写。","text":"Real-time Bandwidth Inspection（实时带宽检查）"},{"isCorrect":false,"rationale":"这与浏览器安全无关。","text":"Randomized Binary Integration（随机二进制集成）"},{"isCorrect":false,"rationale":"虽然备份很重要，但这不是 RBI 的含义。","text":"Robust Backup Infrastructure（稳健的备份基础设施）"},{"isCorrect":true,"rationale":"RBI 通过在隔离环境中渲染网页来防止恶意代码到达用户的终端设备。","text":"Remote Browser Isolation（远程浏览器隔离）"}],"hint":"它旨在防止员工在浏览有风险的网站时感染系统。","question":"SASE 报告中提到的“RBI”组件代表什么？"}];
        let currentIndex = 0;
        let mode = 'quiz';
        let state = quizData.map(() => ({ selectedIndex: null, hintVisible: false }));

        function getStats() {
            const answered = state.filter((s) => s.selectedIndex !== null).length;
            const correct = state.filter((s, i) => s.selectedIndex !== null && quizData[i].answerOptions[s.selectedIndex].isCorrect).length;
            const wrong = state.filter((s, i) => s.selectedIndex !== null && !quizData[i].answerOptions[s.selectedIndex].isCorrect).length;
            const skipped = quizData.length - answered;
            const accuracy = answered > 0 ? Math.round((correct / answered) * 100) : 0;
            return { answered, correct, wrong, skipped, accuracy };
        }

        function shuffleAnswers() {
            quizData.forEach((q) => {
                for (let i = q.answerOptions.length - 1; i > 0; i -= 1) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.answerOptions[i], q.answerOptions[j]] = [q.answerOptions[j], q.answerOptions[i]];
                }
            });
        }

        function shuffleQuestions() {
            for (let i = quizData.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
            }
        }

        function resetState() {
            state = quizData.map(() => ({ selectedIndex: null, hintVisible: false }));
        }

        function renderQuestion() {
            const q = quizData[currentIndex];
            const s = state[currentIndex];
            const content = document.getElementById('quiz-content');
            const results = document.getElementById('results-content');
            const hintBox = document.getElementById('hint-box');
            const nav = document.querySelector('.navigation');
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');

            let optionsHtml = '';
            const correctIndex = q.answerOptions.findIndex((o) => o.isCorrect);
            const selectedCorrect = s.selectedIndex !== null && q.answerOptions[s.selectedIndex].isCorrect;
            q.answerOptions.forEach((opt, idx) => {
                const isSelected = s.selectedIndex === idx;
                const statusClass = isSelected ? (opt.isCorrect ? 'correct' : 'incorrect') : '';
                const selectedClass = isSelected ? 'selected' : '';
                const revealCorrect = (s.selectedIndex !== null && !selectedCorrect && opt.isCorrect) || (mode === 'review' && opt.isCorrect);
                const revealClass = revealCorrect ? 'revealed-correct' : '';

                optionsHtml += `
                    <li class="option-item ${selectedClass} ${statusClass} ${revealClass}" onclick="selectOption(${idx})">
                        <div class="option-label">
                            <span>${String.fromCharCode(65 + idx)}. ${opt.text}</span>
                        </div>
                        <div class="feedback-state">
                            ${opt.isCorrect ? '✓ Right answer' : '✕ Not quite'}
                        </div>
                        ${opt.rationale ? '<div class="rationale">' + opt.rationale + '</div>' : ''}
                    </li>
                `;
            });

            const stats = getStats();

            content.innerHTML = `
                <div class="progress-container">
                    <div class="progress-text">${currentIndex + 1} / ${quizData.length}</div>
                    <div class="status-bar">
                        <div class="status-item status-correct">
                            <span>✓</span>
                            <span>${stats.correct}</span>
                        </div>
                        <div class="status-item status-wrong">
                            <span>✕</span>
                            <span>${stats.wrong}</span>
                        </div>
                    </div>
                </div>
                <div class="question-text">${q.question}</div>
                <ul class="options-list">
                    ${optionsHtml}
                </ul>
            `;

            // Update Hint Box
            const hintText = document.getElementById('hint-text');
            hintText.innerText = q.hint || 'No hint available for this question.';
            if (s.hintVisible) {
                hintBox.classList.add('active');
            } else {
                hintBox.classList.remove('active');
            }

            results.classList.add('hidden');
            content.classList.remove('hidden');
            hintBox.classList.remove('hidden');
            nav.classList.remove('hidden');

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = false;
            if (mode === 'review') {
                nextBtn.innerText = currentIndex === quizData.length - 1 ? 'Back to Results' : 'Next';
            } else {
                nextBtn.innerText = currentIndex === quizData.length - 1 ? 'Finish' : 'Next';
            }
            document.getElementById('hint-icon-arrow').innerText = s.hintVisible ? '▲' : '▼';
        }

        function selectOption(idx) {
            if (mode !== 'quiz') return;
            if (state[currentIndex].selectedIndex !== null) return; // Prevent re-selection
            state[currentIndex].selectedIndex = idx;
            renderQuestion();
        }

        function toggleHint() {
            if (mode === 'results') return;
            state[currentIndex].hintVisible = !state[currentIndex].hintVisible;
            renderQuestion();
        }

        function renderResults() {
            const stats = getStats();
            const content = document.getElementById('quiz-content');
            const results = document.getElementById('results-content');
            const hintBox = document.getElementById('hint-box');
            const nav = document.querySelector('.navigation');

            const score = `${stats.correct} / ${quizData.length}`;

            results.innerHTML = `
                <div class="results-screen">
                    <div>
                        <h1 class="results-title">You did it! Quiz Complete.</h1>
                        <p class="results-subtitle">Review your score or take another run.</p>
                    </div>
                    <div class="results-grid">
                        <div class="result-card">
                            <div class="result-label">Score</div>
                            <div class="result-value">${score}</div>
                        </div>
                        <div class="result-card">
                            <div class="result-label">Accuracy</div>
                            <div class="result-value">${stats.accuracy}%</div>
                        </div>
                        <div class="result-card">
                            <div class="result-metrics">
                                <div>Right <strong>${stats.correct}</strong></div>
                                <div>Wrong <strong>${stats.wrong}</strong></div>
                                <div>Skipped <strong>${stats.skipped}</strong></div>
                            </div>
                        </div>
                    </div>
                    <div class="results-actions">
                        <button id="review-btn" class="btn btn-ghost">Review Quiz</button>
                        <button id="retake-btn" class="btn btn-next">Retake Quiz</button>
                    </div>
                </div>
            `;

            content.classList.add('hidden');
            results.classList.remove('hidden');
            hintBox.classList.add('hidden');
            nav.classList.add('hidden');

            document.getElementById('review-btn').onclick = () => {
                mode = 'review';
                currentIndex = 0;
                renderQuestion();
            };

            document.getElementById('retake-btn').onclick = () => {
                mode = 'quiz';
                currentIndex = 0;
                shuffleQuestions();
                shuffleAnswers();
                resetState();
                renderQuestion();
            };
        }

        document.getElementById('prev-btn').onclick = () => {
            if (mode === 'results') return;
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        };

        document.getElementById('next-btn').onclick = () => {
            if (mode === 'results') return;
            if (mode === 'review') {
                if (currentIndex < quizData.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    mode = 'results';
                    renderResults();
                }
                return;
            }
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                mode = 'results';
                renderResults();
            }
        };

        document.getElementById('hint-toggle').onclick = toggleHint;

        renderQuestion();
    </script>
